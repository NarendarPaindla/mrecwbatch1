<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample HTML Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    header {
      background-color: #4CAF50;
      color: white;
      padding: 15px;
      text-align: center;
    }
    main {
      background: white;
      padding: 20px;
      border-radius: 8px;
    }
    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9em;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to My Website</h1>
  </header>

  <main>
    <h2>About This Page</h2>
    <p>This is a sample HTML page with basic structure including header, content, and footer.</p>
    <ul>
      <li>Clean layout</li>
      <li>Responsive design</li>
      <li>Simple and readable</li>
    </ul>
    <a href="https://www.example.com" target="_blank">Visit Example.com</a>
  </main>

  <footer>
    &copy; 2025 Sample HTML Page. All rights reserved.
  </footer>

</body>
</html>
